{% extends "base.html" %}
{% block title %}비밀번호 변경 · {{ app_title }}{% endblock %}

{% block content %}
<div class="page-head">
  <div><h1>비밀번호 변경</h1></div>
</div>

<div class="card" style="max-width:480px;">
  <div class="card-body">
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <form method="post" action="/change-password">
      <div class="form-row">
        <label class="lbl" for="cur">현재 비밀번호</label>
        <input type="password" id="cur" name="current_password" autocomplete="current-password" required>
      </div>
      <div class="form-row">
        <label class="lbl" for="new">새 비밀번호</label>
        <input type="password" id="new" name="new_password" autocomplete="new-password" required>
        <div class="help">6자 이상</div>
      </div>
      <div class="form-row">
        <label class="lbl" for="cfm">새 비밀번호 확인</label>
        <input type="password" id="cfm" name="confirm_password" autocomplete="new-password" required>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">변경</button>
        <a class="btn" href="/">취소</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
