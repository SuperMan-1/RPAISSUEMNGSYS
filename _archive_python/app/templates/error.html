{% extends "base.html" %}
{% block title %}오류 {{ code }} · {{ app_title }}{% endblock %}

{% block content %}
<div class="card" style="max-width:520px; margin:40px auto;">
  <div class="card-body" style="text-align:center; padding:36px 24px;">
    <div style="font-size:32px; font-weight:700; color:var(--text-faint);">{{ code }}</div>
    <p style="margin:10px 0 22px; font-size:14.5px;">
      {{ message or '요청을 처리할 수 없습니다.' }}
    </p>
    <div class="btn-row" style="justify-content:center;">
      <a class="btn btn-primary" href="/">대시보드로</a>
      <a class="btn" href="javascript:history.back()">뒤로</a>
    </div>
  </div>
</div>
{% endblock %}
